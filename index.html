<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Axen Studios — Developer</title>
  <meta name="description" content="Official developer website for Axen Studios.">
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f9fc;color:#10233f}
    .hero{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
    .card{width:min(920px,100%);background:white;border:1px solid #e5eaf2;border-radius:28px;padding:48px;box-shadow:0 18px 50px rgba(16,35,63,.10)}
    .brand{font-size:18px;font-weight:800;letter-spacing:3px;color:#168cff;text-transform:uppercase}
    h1{font-size:clamp(42px,8vw,76px);margin:14px 0 10px;line-height:1}
    p{font-size:18px;line-height:1.7;color:#52627a;max-width:680px}
    .game{margin-top:30px;padding:22px;border-radius:20px;background:#f0f7ff;border:1px solid #d9ebff}
    .game h2{margin:0 0 8px}.small{font-size:14px;color:#718096}
    footer{margin-top:34px;font-size:13px;color:#8a96a8}
  </style>
</head>
<body>
  <main class="hero">
    <section class="card">
      <div class="brand">AXEN STUDIOS</div>
      <h1>Games made to challenge you.</h1>
      <p>
        Axen Studios is an independent game studio creating simple, polished and
        challenging mobile games.
      </p>
      <div class="game">
        <h2>Arrow Escape</h2>
        <div class="small">A mobile brain-puzzle game from Axen Studios.</div>
      </div>
      <footer>© 2026 Axen Studios. All rights reserved.</footer>
    </section>
  </main>
</body>
</html>
